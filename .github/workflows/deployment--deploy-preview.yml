name: "Déploiement / Aperçu (pull request)"
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: .github/scripts/build-site.sh _site
      - name: Test de fumée
        run: |
          npm i --no-save playwright@1.49.0 && npx playwright install --with-deps chromium
          node tests/smoke.js _site
      - uses: actions/upload-artifact@v4
        with:
          name: apercu-site
          path: _site
          retention-days: 7
      - name: Commentaire
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,
              body:'Aperçu assemblé et testé : télécharger l\u2019artefact « apercu-site » dans l\u2019onglet Actions de cette exécution.'})
