<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pissourit</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{--cream:#fff8e7;--leaf:#7acb7f;--ink:#6b4f3a;--coral:#ff8e7f;--sun:#ffd36b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#9fdcf2;font-family:'VT323',monospace;font-size:20px;color:var(--ink)}
#wrap{position:fixed;inset:0;transition:transform 1s cubic-bezier(.2,.8,.2,1)}
canvas{width:100%;height:100%;display:block;touch-action:none;image-rendering:pixelated}
.card{background:var(--cream);border:4px solid #6b4f3a;border-radius:0;box-shadow:4px 4px 0 #6b4f3a;padding:6px 14px}
#top{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none}
#top>*{pointer-events:auto}
#nom{font-size:21px;font-weight:700;line-height:1}#info{font-size:13px;opacity:.7}
#needs{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.pill{display:flex;align-items:center;gap:5px;font-size:15px;padding:1px 9px 1px 5px;background:var(--cream);border:3px solid #6b4f3a;border-radius:0;justify-content:space-between}
.pill i{display:block;width:42px;height:9px;border-radius:0;background:#e7d9bd;overflow:hidden}
.pill b{display:block;height:100%;background:var(--leaf);border-radius:0;transition:width .6s}
.pill.low b{background:var(--coral)}
#msg{position:fixed;top:84px;left:50%;transform:translateX(-50%);font-weight:700;opacity:0;transition:opacity .4s;pointer-events:none;text-align:center}
#dock{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:7px;padding:7px 10px;flex-wrap:wrap;justify-content:center;max-width:96vw}
button{font:inherit;font-weight:700;border:3px solid #6b4f3a;border-radius:0;padding:4px 10px;background:#fff;color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 #6b4f3a;font-size:20px;transition:transform .12s}
button:hover{transform:translateY(-2px)}button:active{transform:translateY(3px);box-shadow:0 1px 0 #0002}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
button em{display:block;font-style:normal;font-size:22px;line-height:1.1}
#act{position:fixed;bottom:108px;left:50%;transform:translateX(-50%);background:var(--sun);font-size:18px;padding:10px 20px;display:none}
#vp{position:fixed;right:10px;bottom:100px;width:262px;display:none;flex-direction:column;gap:5px;font-size:14px;max-height:62vh;overflow:auto}
#vp.on{display:flex}
#vp label{display:flex;justify-content:space-between;align-items:center;gap:6px}
#vp input[type=range]{width:110px;accent-color:var(--leaf)}
select,input[type=number]{font:inherit;border:3px solid #6b4f3a;border-radius:0;background:#fff;color:var(--ink);max-width:130px}
#vape{background:var(--coral);color:#fff;padding:11px;font-size:17px;touch-action:none;user-select:none}
#vape.hold{background:var(--sun);color:var(--ink)}
#modal{position:fixed;inset:0;display:none;place-items:center;background:#0004}
#modal.on{display:grid}
#mb{width:min(560px,94vw);max-height:84vh;overflow:auto;display:flex;flex-direction:column;gap:8px}
#mb h2{margin:0}.row{display:flex;flex-wrap:wrap;gap:6px}
.fam{display:flex;justify-content:space-between;align-items:center;font-size:14px;gap:6px}
#start{position:fixed;inset:0;display:none;place-items:center;background:#9fdcf2cc}
#start .card{text-align:center;padding:22px 28px;display:flex;flex-direction:column;gap:10px;align-items:center}
h1{margin:0;font-size:30px}
@media(prefers-reduced-motion:reduce){#wrap{transition:none}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="top">
  <div class="card"><div id="nom" data-t>Pissourit</div><div id="info"></div></div>
  <div id="needs"></div>
  <div class="card">🪙 <b id="jet">0</b> · 📦 <b id="stk">0</b> <span id="stars"></span></div>
</div>
<div id="msg" class="card" data-t></div>
<button id="act"></button>
<div id="vp" class="card">
  <b data-t>Ma vape</b>
  <label>Nicotine <select id="mg"></select></label>
  <label>Puissance <input id="pow" type="range" min="1" max="10" value="5"></label>
  <label>Sucré <input class="fl" type="range" min="0" max="10" value="0"></label>
  <label>Sûr <input class="fl" type="range" min="0" max="10" value="0"></label>
  <label>Frais <input class="fl" type="range" min="0" max="10" value="0"></label>
  <label>Piquant <input class="fl" type="range" min="0" max="10" value="0"></label>
  <label>Salé <input class="fl" type="range" min="0" max="10" value="0"></label>
  <div id="gt" style="font-size:12px"></div>
  <label>Type <select id="ty"><option value="vape">Vape</option><option value="cigare">Cigare</option><option value="cigarette">Cigarette</option></select></label><label>Papier <input id="cl" type="color" value="#c0c0c0"></label><label>Ajout <select id="aj"></select></label>
  <button id="vape">Maintenir pour aspirer</button>
  <div id="tox"></div>
</div>
<div id="dock" class="card"></div>
<div id="modal"><div id="mb" class="card"></div></div>
<div id="start"><div class="card"><h1 data-t>Un œuf t'attend !</h1><div>Couleurs, sexe et traits sont tirés au hasard, puis fixés pour toujours.</div><button id="make"><em>🥚</em>Créer mon Pissourit</button></div></div>
<script>
const KEY='pissourit_v2',$=id=>document.getElementById(id);
const STAGES=[['Œuf',4],['Têtard',3],['Têtard à pattes',7],['Larve',14],['Chenille',21],['Chrysalide',3],['Bébé',21],['Adolescent',21],['Jeune adulte',56],['Adulte',119],['Vieillot',14],['Grand-parent',42]];
const SZ=[.6,.55,.65,.5,.6,.5,.62,.82,1,1.08,1,.94];
const NEEDS=[['faim','🍎',5],['soif','💧',7],['div','🎈',3],['prop','🫧',2],['ener','🌙',4],['aff','💗',2],['conf','🛋️',0]];
const ACTS=[['mus','💪','Muscler',1,0],['faim','🍎','Nourrir',4,35],['soif','💧','Boire',2,45],['div','🎈','Jouer',1,25],['aff','💗','Caresser',.5,15],['prop','🫧','Nettoyer',6,50],['ener','🌙','Dormir',8,60]];
const MGS=[1,2,5,10,15,25,30,45,65,90,120,150,200,300,450,600,820,1125];
const FAMS=[['chro','Chrométhine','Mélange de lettres'],['defo','Déformine','Distorsion'],['moti','Motilithe','Mouvement ralenti'],['lat','Latérine','Clics retardés'],['temp','Temporine','Animations lentes'],['anim','Animéthine','Animations folles'],['obsc','Obscurine','Faux objets'],['fant','Fantomine','Faux Pissourits'],['best','Bestérite','Faux animaux'],['opt','Optéline','Illusions optiques'],['para','Paraxine','Paranoïa +'],['fert','Fertilithe','Fertilité −'],['hydr','Hydratérite','Déshydratation'],['vita','Vitaline','Santé −'],['dep','Dépendrite','Dépendance +'],['manq','Manquélite','Manque +'],['toxe','Toxérite','Toxicité +'],['endu','Endurite','Endurance +'],['nutri','Nutrilithe','Faim −'],['recre','Récréolite','Divertissement +']];
const FCOL=[[255,170,210],[190,235,120],[150,235,240],[255,170,110],[200,190,255]];
const HATS=[['🎩',15],['👑',40],['🌸',10],['🎀',12],['🧢',18],['🪖',25]];
const NAMES=['Mimi','Choupi','Plume','Kiwi','Nono','Bulle','Pépito','Lulu','Zazou','Fripon'];
let S=null,TI=0;
function mul(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function HH(a,b,s=0){let h=(a*374761393+b*668265263+s*2147483647)|0;h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967296}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function genes(r){const h=()=>Math.floor(r()*360);return{plume:h(),cheveux:h(),oeil:h(),bec:h(),ongle:h(),motif:['uni','tachete','raye'][Math.floor(r()*3)],taille:.92+r()*.2,coiffure:Math.floor(r()*15)}}
function create(){const seed=Math.floor(Math.random()*1e9),r=mul(seed);
  S={seed,born:Date.now(),last:Date.now(),name:'',sex:r()<.5?'F':'M',g:genes(r),n:{faim:80,soif:80,div:80,prop:90,ener:90,aff:80},sante:100,
   pan:0,endu:0,dep:0,manque:0,tox:0,fert:100,jet:60,xp:0,cd:{},stock:0,wanted:0,hat:'',fx:{},fxt:0,
   vape:{mg:5,f:[0,0,0,0,0],aj:-1},ajouts:[],x:-300,y:-190};
  S.n.conf=80;S.parts={};S.log=[];S.temp=22;S.def=Date.now();S.vape.t='vape';S.vape.c='#c0c0c0';S.mem=[];S.births={};S.disc=[];S.rch=0;S.alt=null;S.gen=null;S.name=prompt('Nom de ton Pissourit ?')||'Pissou';save();ui()}
function stage(){const d=(Date.now()-S.born)/864e5;let a=0;for(let i=0;i<STAGES.length;i++){a+=STAGES[i][1];if(d<a)return i}return -1}
function tick(){const dt=(Date.now()-S.last)/36e5*(S.anes>Date.now()?.25:1);S.last=Date.now();const st=stage();if(st<0){S.mort=true;return}
  const hy=S.fxt>0&&S.fx.hydr?1+S.fx.hydr*.3:1;
  NEEDS.forEach(([k,,v])=>{if(st>=1||k=='prop')S.n[k]=Math.max(0,S.n[k]-v*dt*(k=='soif'?hy:1))});
  if(st==0)S.n.faim=S.n.soif=S.n.div=100;S.fat=Math.min(3,Math.max(0,(S.fat||0)+(S.n.faim>90?.3:-.08)*dt));S.mus=Math.max(0,(S.mus||0)-.04*dt)-(S.n.faim<10?.3*dt:0);
  const bad=Object.values(S.n).filter(v=>v<15).length;
  S.sante=Math.min(100,Math.max(0,S.sante+(bad>1?-3:Object.values(S.n).every(v=>v>50)?1:0)*dt));
  S.pan=Math.max(0,S.pan-15*dt);S.tox=Math.max(0,S.tox-(8+S.endu/6)*dt);S.manque=Math.min(100,S.manque+S.dep*1.5*dt);S.fert=Math.min(100,S.fert+10*dt);
  if(S.manque>60)S.pan=Math.min(100,S.pan+5*dt);
  {const[ti,ta,tb]=TEMPS[st],d=S.temp<ta?ta-S.temp:S.temp>tb?S.temp-tb:0,pen=Math.abs(S.temp-ti)<.6?-2:d==0?1:d<=3?3:6;S.n.conf=Math.max(0,Math.min(100,S.n.conf-pen*dt));S.temp+=(S.temp>18?-1:1)*.3*dt;
   if(d>0&&Date.now()-(S.nt?.t||0)>9e5){S.nt={...S.nt,t:Date.now()};say('La température de l\'habitat est inadaptée !');log('Température inadaptée')}
   [['faim','a faim !'],['soif','a soif !'],['div','s\'ennuie !'],['prop','a besoin d\'être nettoyé !']].forEach(([k,m])=>{if(S.n[k]<30&&Date.now()-(S.nt?.[k]||0)>6e5){S.nt={...S.nt,[k]:Date.now()};say('Ton Pissourit '+m);log('Ton Pissourit '+m)}});
   if(st>=7&&Date.now()-S.def>1728e5&&Math.random()<.3*dt){S.sante=Math.max(0,S.sante-10);S.def=Date.now()-1440e5;log('Attaqué : la défense n\'avait pas été vérifiée !');say('⚠ Ton Pissourit a été attaqué !')}}
  if(S.rch&&S.jet>0){S.jet=Math.max(0,S.jet-S.rch*2*dt);if(Math.random()<S.rch*.3*dt)research(1)}
  if(S.co){const ks=['faim','soif','div','prop','aff'],k=ks.reduce((a,b)=>S.n[a]<S.n[b]?a:b);S.n[k]=Math.min(100,S.n[k]+6*dt)}
  if((S.n.faim<=0&&st>=6)||S.sante<=0||S.tox>=100)S.mort=true}
function log(t){S.log.unshift(new Date().toLocaleString('fr-CA')+' — '+t);S.log=S.log.slice(0,40)}
function say(t){const m=$('msg');m.textContent=t;m.dataset.o='';m.style.opacity=1;clearTimeout(say.t);say.t=setTimeout(()=>m.style.opacity=0,2600)}
function ui(){$('start').style.display=S?'none':'grid';if(!S)return;if(S.mort&&!S.memDone)die();
  $('nom').textContent=S.name;$('nom').dataset.o='';const st=stage();
  $('info').textContent=S.mort?'Parti rejoindre les étoiles':STAGES[st][0]+' · '+(S.sex=='F'?'femelle':'mâle')+' · '+(S.temp||22).toFixed(1)+'°C'+((S.fat||0)>1.5?' · gros':'')+((S.mus||0)>1.2?' · très musclé':(S.mus||0)>.5?' · musclé':'');
  $('needs').innerHTML=NEEDS.map(([k,e])=>{const v=Math.round(S.n[k]);return`<div class="pill ${v<30?'low':''}">${e}<i><b style="width:${v}%"></b></i></div>`}).join('')+`<div class="pill ${S.sante<50?'low':''}">❤️<i><b style="width:${S.sante}%"></b></i></div>`;
  $('tox').innerHTML=[['pan','Paranoïa'],['tox','Toxicité'],['endu','Endurance'],['manque','Manque']].map(([k,l])=>`<div class="pill" style="margin-top:3px">${l}<i><b style="width:${Math.min(100,S[k])}%;background:${k=='endu'?'var(--leaf)':'var(--coral)'}"></b></i></div>`).join('');
  $('jet').textContent=Math.round(S.jet);$('stk').textContent=S.stock;$('stars').textContent='⭐'.repeat(S.wanted);
  $('aj').innerHTML='<option value="-1">Aucun</option>'+S.ajouts.map((a,i)=>`<option value="${i}" ${S.vape.aj==i?'selected':''}>${a.nom}</option>`).join('');
  const t=S.vape.f.reduce((a,b)=>a+b,0);$('gt').textContent=`Goûts : ${t}/23`+(t>0||S.vape.aj>=0?' · ⚠ illégal en ville':'');
  document.querySelectorAll('#dock [data-i]').forEach(b=>{const[k]=ACTS[+b.dataset.i];b.disabled=S.mort||(S.cd[k]&&Date.now()<S.cd[k])||(st<1&&k!='prop')||(st<3&&k=='ener')})}
function act(i){const[k,,l,h,v]=ACTS[i];if(S.cd[k]&&Date.now()<S.cd[k])return;if(S.anes>Date.now())return say('Il dort (anesthésie).');if(['faim','div','prop'].includes(k)&&!act.skip)return mini(l,sc=>{act.f=.5+.5*sc;act.skip=1;act(i);act.skip=0;act.f=1});if(k=='mus'){if(stage()<6)return;S.mus=Math.min(2,(S.mus||0)+.25);S.fat=Math.max(0,(S.fat||0)-.2);S.n.ener=Math.max(0,S.n.ener-10);S.n.faim=Math.max(0,S.n.faim-8);S.cd[k]=Date.now()+36e5;S.jet+=3;burst('💪',4);say('Entraînement ✔');save();ui();return}
  S.n[k]=Math.min(100,S.n[k]+v*(act.f||1));S.cd[k]=Date.now()+h*36e5;
  if(k=='div'){S.n.ener=Math.max(0,S.n.ener-10);S.n.faim=Math.max(0,S.n.faim-3)}
  S.jet+=3;S.xp+=5;burst('♥',6);say(l+' ✔');save();ui()}
$('dock').innerHTML=ACTS.map((a,i)=>`<button data-i="${i}"><em>${a[1]}</em>${a[2]}</button>`).join('')+'<button id="tp"><em>🌡️</em>Temp.</button><button id="cb"><em>🥊</em>Combat</button><button id="jr"><em>📖</em>Journal</button><button id="an"><em>💉</em>Anesthésie</button><button id="sw"><em>🔄</em>Changer</button><button id="fm"><em>🌳</em>Famille</button><button id="vt"><em>💨</em>Vape</button>';
$('dock').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.id=='vt')return $('vp').classList.toggle('on');if(b.id=='tp')return tempGame();if(b.id=='an')return anes();if(b.id=='sw')return swap();if(b.id=='fm')return fam();if(b.id=='cb')return combat();if(b.id=='jr')return openM('<h2>Journal</h2>'+(S.log.length?S.log.map(x=>'<div>'+x+'</div>').join(''):'Rien pour l\'instant.'));
  if(b.dataset.i){const d=S.fx.lat&&S.fxt>0?S.fx.lat*350:0;setTimeout(()=>act(+b.dataset.i),d)}};
$('mg').innerHTML=MGS.map(m=>`<option>${m}</option>`).join('');
$('mg').onchange=()=>{S.vape.mg=+$('mg').value;save()};
$('aj').onchange=()=>{S.vape.aj=+$('aj').value;save();ui()};
document.querySelectorAll('.fl').forEach((el,i)=>el.oninput=()=>{const o=S.vape.f.reduce((a,b,j)=>a+(j==i?0:b),0);el.value=Math.min(+el.value,23-o);S.vape.f[i]=+el.value;ui()});
$('make').onclick=create;$('ty').onchange=()=>{S.vape.t=$('ty').value;save()};$('cl').oninput=()=>{S.vape.c=$('cl').value;save()};

/* ---------- Monde infini ---------- */
const CH=640,RD=90,chunks={};
const TOWN=[{k:'b',kind:'shop',x:110,y:250,w:110,h:110,wall:'#ffd9a8',roof:'#ff8e7f',label:'Dépanneur'},{k:'b',kind:'police',x:240,y:250,w:110,h:110,wall:'#cfe0ff',roof:'#5b7fd6',label:'Commissariat'},{k:'b',kind:'lab',x:370,y:250,w:110,h:110,wall:'#e3f7d8',roof:'#7a5bd6',label:'Laboratoire'},{k:'b',kind:'mall',x:500,y:250,w:120,h:110,wall:'#ffe1f0',roof:'#e0629c',label:'Centre commercial'},{k:'fountain',x:320,y:520}];
function chunk(cx,cy){const k=cx+','+cy;if(chunks[k])return chunks[k];const o=[],r=mul(Math.floor(HH(cx,cy)*1e9)),x0=cx*CH+RD,y0=cy*CH+RD,w=CH-RD;
  if(cx==0&&cy==0)TOWN.forEach(b=>o.push({...b,x:b.x+x0-RD,y:b.y+y0-RD}));
  if(cx==-1&&cy==-1){o.push({k:'b',kind:'home',x:-480,y:-420,w:130,h:110,wall:'#fff1c9',roof:'#6fbf73',label:'Ma maison'},{k:'pond',x:-300,y:-250,rx:120,ry:42})}
  const n=cx==0&&cy==0?4:6+Math.floor(r()*6);
  for(let i=0;i<n;i++){const t=r(),x=x0+30+r()*(w-60),y=y0+70+r()*(w-90);
    if(t<.14&&!(cx==0&&cy==0)){const c=Math.floor(r()*360);o.push({k:'b',kind:'house',x,y,w:90+r()*30,h:90,wall:hsl(c,70,88),roof:hsl((c+150)%360,55,68),label:''})}
    else if(t<.6)o.push({k:'tree',x,y,s:.8+r()*.5,c:r()<.4});
    else if(t<.78)o.push({k:'bush',x,y});else if(t<.88)o.push({k:'rock',x,y});else o.push({k:'flower',x,y,h:[330,50,200,10,280][i%5]})}
  if(r()<.12&&!(cx==-1&&cy==-1))o.push({k:'pond',x:x0+w/2,y:y0+w/2,rx:100,ry:36});
  return chunks[k]={o}}
const hsl=(h,s,l,a=1)=>`hsla(${h},${s}%,${l}%,${a})`;
const cv=$('c'),cx=cv.getContext('2d');let W,H,DPR,Z=1,T=0;
const PIX=3;function size(){DPR=1/PIX;W=innerWidth;H=innerHeight;cv.width=Math.ceil(W*DPR);cv.height=Math.ceil(H*DPR);cx.imageSmoothingEnabled=false;Z=Math.max(.7,Math.min(W,H)/560)}
addEventListener('resize',size);size();
const cam={x:-300,y:-190},P0={x:-300,y:-190,dir:1,walk:0,tx:null,ty:null};
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key=='Escape')closeM();if(e.key.toLowerCase()=='e'&&ctx&&!$('modal').classList.contains('on'))ctx.fn()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
cv.onpointerdown=e=>{if(!S)return;const x=(e.clientX-W/2)/Z+cam.x,y=(e.clientY-H/2)/Z+cam.y;
  if(Math.abs(x-P0.x)<40&&Math.abs(y-P0.y+30)<50){S.n.aff=Math.min(100,S.n.aff+2);burst('♥',4)}else{P0.tx=x;P0.ty=y}};
function blocked(x,y){for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++)for(const o of chunk(Math.floor(x/CH)+a,Math.floor(y/CH)+b).o)if(o.k=='b'&&x>o.x-8&&x<o.x+o.w+8&&y>o.y+o.h*.4&&y<o.y+o.h)return 1;return 0}
const hearts=[];function burst(c,n){for(let i=0;i<n;i++)hearts.push({x:P0.x+(Math.random()-.5)*50,y:P0.y-70,vy:-1-Math.random(),vx:(Math.random()-.5),l:0,c})}
/* ---------- Dessin ---------- */
function rr(x,y,w,h,r){cx.beginPath();cx.roundRect(x,y,w,h,r)}
