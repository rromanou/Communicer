name: "Maintenance / Audit hebdomadaire"
on:
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Contrôles
        id: c
        continue-on-error: true
        run: |
          set +e; : > report.txt; rc=0
          for c in "check_sql.py all" "check_html.py" "check_files.py size" "check_files.py dup" "check_perms.py"; do
            echo "== $c" >> report.txt; python3 .github/scripts/$c >> report.txt 2>&1 || rc=1
          done
          cat report.txt; exit $rc
      - name: Ouvrir un ticket si échec
        if: steps.c.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const body=require('fs').readFileSync('report.txt','utf8').slice(0,60000);
            await github.rest.issues.create({...context.repo,title:'Audit hebdomadaire : problèmes détectés',body:'```\n'+body+'\n```'});
