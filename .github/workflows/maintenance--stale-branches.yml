name: "Maintenance / Branches inactives"
on:
  schedule:
    - cron: "0 7 1 * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const limit=Date.now()-90*864e5;const out=[];
            const bs=await github.paginate(github.rest.repos.listBranches,{...context.repo,per_page:100});
            for(const b of bs){if(b.name===context.payload.repository.default_branch)continue;
              const c=await github.rest.repos.getCommit({...context.repo,ref:b.commit.sha});
              const d=new Date(c.data.commit.committer.date).getTime();if(d<limit)out.push(`- ${b.name} (dernier commit : ${new Date(d).toISOString().slice(0,10)})`)}
            core.summary.addHeading('Branches inactives depuis 90 jours').addRaw(out.join('\n')||'Aucune').write();
            if(out.length)await github.rest.issues.create({...context.repo,title:'Branches inactives (90 jours)',body:out.join('\n')});
