name: "Déploiement / Application Android (APK signé)"
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/deployment--android-apk.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-apk
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Icônes depuis android/src/data/img.ico
        run: |
          pip install pillow
          python3 android/tools/make_icons.py
      - name: Clé de signature (secrets GitHub)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::Secret ANDROID_KEYSTORE_B64 absent (Settings > Secrets and variables > Actions)"; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/communicer.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/communicer.keystore" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compiler et signer
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon
      - name: Vérifier la signature
        run: |
          APK=android/app/build/outputs/apk/release/Communicer.apk
          AS=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -1)
          "$AS" verify --verbose --print-certs "$APK" | head -8
          cp "$APK" android/src/Communicer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Communicer-apk
          path: android/src/Communicer.apk
      - name: Enregistrer l'APK dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f android/src/Communicer.apk
          git diff --cached --quiet || (git commit -m "APK Communicer $(python3 -c "import json;print(json.load(open('android/src/data/data.json'))['version'])") [skip ci]" && git push)
